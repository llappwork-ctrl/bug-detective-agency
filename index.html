<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>The Bug Detective Agency</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>The Bug Detective Agency</h1>
  <h2>Laura's Detective's Office</h2>

  <main id="office">

    <section id="left-side">
<div id="window">
    <div class="window-glass">
        <div class="window-blind"></div>
        <div class="window-blind"></div>
        <div class="window-blind"></div>
        <div class="window-blind"></div>
    </div>
</div>
<!-- The bookshelves are painted into the background picture now, so #bookcase is only an
     invisible layer. The button below sits over the painted Suspicious Begonias book. -->
<div id="bookcase">
    <button
        type="button"
        id="begonia-book"
        class="special-book"
        aria-label="Suspicious Begonias"
    ></button>
</div>
        
<p id="mabel-dialogue" aria-live="polite" hidden></p>
  
<div id="chaise">

    <img src="images/objects/03_purple_chaise.png" alt="Mabel's purple velvet chaise with a cream knitted throw and a butterfly pillow">
        <div id="mabel">Mabel reading a battered case file (placeholder)</div>
  </div>

    </section>

    <section id="right-side">
      <!-- Decorative chair: sits behind the desk and never takes clicks. -->
      <img id="chair" src="images/objects/Whimsical_chair.png" alt="">

      <!-- Decorative flower floor lamp: behind the desk and the chaise, never takes clicks. -->
      <img id="flower-lamp" src="images/objects/04_orange_flower_floor_lamp (2).png" alt="" hidden>

      <!-- Mario's mushroom lamp, standing on the desk. The picture is decoration;
           the button is the real control. It comes before #desk in the page so the
           keyboard Tab order stays the same (lamp, then Case File). -->
      <div id="mushroom-lamp">
        <img src="images/objects/06_mario_green_mushroom_lamp.png" alt="">
        <button type="button" class="desk-lamp" id="mario-lamp" aria-pressed="false">
         🟢 Mario's Lamp
        </button>
      </div>

      <div id="desk">

    <div class="desk-folder">
        📁 Case #001 — UNSOLVED
    </div>

    <div class="desk-nameplate">
        Mabel Quibble — Director of Emotional Chaos
    </div>

    <button id="case-file-button">
        Look at the Case File
    </button>
  </div>
</section>

</main>

  <aside id="case-panel">
    <h3>Case Files</h3>
    <ul>
      <li>Case #000: The Missing Garden Gnome — SOLVED</li>
      <li>Case #001: The Curious Case of the Mixed-Up Records — UNSOLVED</li>
    </ul>
  </aside>

  <script src="script.js"></script>
</body>
</html>
